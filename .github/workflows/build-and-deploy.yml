name: Build and Deploy TradeVisor

on:
  push:
    branches: [ main, master, deploy ]
  pull_request:
    branches: [ main, master, deploy ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradevisor-jar
          path: build/libs/*.jar

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: tradevisor-jar
          path: build/libs/

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          # Create target directory if it doesn't exist
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/app"

          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "rm -rf /home/${{ secrets.SERVER_USER }}/app/infra/nginx/conf.d/*"

          # Copy built JAR file to server
          scp -o StrictHostKeyChecking=no build/libs/*.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/app/app.jar

          # Copy infrastructure files to server
          scp -o StrictHostKeyChecking=no -r infra/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/app/

          # Connect to server and deploy securely with proper environment variable passing
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash -s << 'EOF'
            set -e

            cd /home/${{ secrets.SERVER_USER }}/app/infra

            # Remove any existing .env file for security
            rm -f .env

            # Make deploy script executable
            chmod +x ./scripts/deploy-secure.sh

            # Execute deployment with environment variables passed directly to the script
            ./scripts/deploy-secure.sh
          EOF

          # Set up cron for certificate renewal
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/app/infra
            chmod +x ./scripts/setup-certbot-cron.sh
            ./scripts/setup-certbot-cron.sh
          EOF
