name: Build and Deploy TradeVisor

on:
  push:
    branches: [ main, master, deploy ]
  pull_request:
    branches: [ main, master, deploy ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradevisor-jar
          path: build/libs/*.jar

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: tradevisor-jar
          path: build/libs/

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          # Create target directory if it doesn't exist
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/app"
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "rm -rf /home/${{ secrets.SERVER_USER }}/app/infra/nginx/conf.d/*"
          
          # Copy built JAR file to server
          scp -o StrictHostKeyChecking=no build/libs/*.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/app/app.jar
          
          # Copy infrastructure files to server
          scp -o StrictHostKeyChecking=no -r infra/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/app/
          
          # Connect to server and deploy with environment variables
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "export CHAT_ID='${{ secrets.CHAT_ID }}' && \
          export CHAT_TOKEN='${{ secrets.CHAT_TOKEN }}' && \
          export BASE_URL='${{ secrets.BASE_URL }}' && \
          export SUPERGROUP_CHAT_ID='${{ secrets.SUPERGROUP_CHAT_ID }}' && \
          export POSITIONS_TOPIC_THREAD_ID='${{ secrets.POSITIONS_TOPIC_THREAD_ID }}' && \
          export ORDERS_TOPIC_THREAD_ID='${{ secrets.ORDERS_TOPIC_THREAD_ID }}' && \
          export RUS_TOPIC_THREAD_ID='${{ secrets.RUS_TOPIC_THREAD_ID }}' && \
          export WORLD_TOPIC_THREAD_ID='${{ secrets.WORLD_TOPIC_THREAD_ID }}' && \
          export CRYPTO_TOPIC_THREAD_ID='${{ secrets.CRYPTO_TOPIC_THREAD_ID }}' && \
          export LOGS_TOPIC_THREAD_ID='${{ secrets.LOGS_TOPIC_THREAD_ID }}' && \
          export STATISTICS_TOPIC_THREAD_ID='${{ secrets.STATISTICS_TOPIC_THREAD_ID }}' && \
          export ERRORS_TOPIC_THREAD_ID='${{ secrets.ERRORS_TOPIC_THREAD_ID }}' && \
          export EVENTS_THREAD_ID='${{ secrets.EVENTS_THREAD_ID }}' && \
          export TINKOFF_INVEST_TOKEN='${{ secrets.TINKOFF_INVEST_TOKEN }}' && \
          export FINAM_API_KEY='${{ secrets.FINAM_API_KEY }}' && \
          export FINAM_ACCOUNT_KEY='${{ secrets.FINAM_ACCOUNT_KEY }}' && \
          export BYBIT_KEY='${{ secrets.BYBIT_KEY }}' && \
          export BYBIT_SECRET='${{ secrets.BYBIT_SECRET }}' && \
          export CLOUDRU_API_KEY='${{ secrets.CLOUDRU_API_KEY }}' && \
          export PROXY_API_KEY='${{ secrets.PROXY_API_KEY }}' && \
          export DEEPSEEK_KEY='${{ secrets.DEEPSEEK_KEY }}' && \
          export GIGACHAT_CLIENT_ID='${{ secrets.GIGACHAT_CLIENT_ID }}' && \
          export GIGACHAT_CLIENT_SECRET='${{ secrets.GIGACHAT_CLIENT_SECRET }}' && \
          export NEWS_API_KEY='${{ secrets.NEWS_API_KEY }}' && \
          export SPRING_DATASOURCE_PASSWORD='${{ secrets.SPRING_DATASOURCE_PASSWORD }}' && \
          
          cd /home/${{ secrets.SERVER_USER }}/app/infra && \
          chmod +x ./scripts/init-ssl.sh && \
          rm -f .env && \
          chmod +x ./scripts/deploy-secure.sh && \
          ./scripts/deploy-secure.sh"
          
          # Set up cron for certificate renewal
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "cd /home/${{ secrets.SERVER_USER }}/app/infra && \
          chmod +x ./scripts/ttools.sh && \
          chmod +x ./scripts/setup-certbot-cron.sh && \
          ./scripts/setup-certbot-cron.sh"