name: Build and Deploy TradeVisor

on:
  push:
    branches: [ main, master, deploy ]
  pull_request:
    branches: [ main, master, deploy ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradevisor-jar
          path: build/libs/*.jar

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: tradevisor-jar
          path: build/libs/

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          # Create target directory if it doesn't exist
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/app"
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "rm -rf /home/${{ secrets.SERVER_USER }}/app/infra/nginx/conf.d/*"
          
          # Copy built JAR file to server
          scp -o StrictHostKeyChecking=no build/libs/*.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/app/app.jar
          
          # Copy infrastructure files to server
          scp -o StrictHostKeyChecking=no -r infra/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/app/
          
          # Create .env file on server from repository secrets
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "echo 'CHAT_ID=${{ secrets.CHAT_ID }}' > /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'CHAT_TOKEN=${{ secrets.CHAT_TOKEN }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'BASE_URL=${{ secrets.BASE_URL }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'SUPERGROUP_CHAT_ID=${{ secrets.SUPERGROUP_CHAT_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'POSITIONS_TOPIC_THREAD_ID=${{ secrets.POSITIONS_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'ORDERS_TOPIC_THREAD_ID=${{ secrets.ORDERS_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'RUS_TOPIC_THREAD_ID=${{ secrets.RUS_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'WORLD_TOPIC_THREAD_ID=${{ secrets.WORLD_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'CRYPTO_TOPIC_THREAD_ID=${{ secrets.CRYPTO_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'LOGS_TOPIC_THREAD_ID=${{ secrets.LOGS_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'STATISTICS_TOPIC_THREAD_ID=${{ secrets.STATISTICS_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'ERRORS_TOPIC_THREAD_ID=${{ secrets.ERRORS_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'EVENTS_TOPIC_THREAD_ID=${{ secrets.EVENTS_TOPIC_THREAD_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'TINKOFF_INVEST_TOKEN=${{ secrets.TINKOFF_INVEST_TOKEN }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'FINAM_API_KEY=${{ secrets.FINAM_API_KEY }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'FINAM_ACCOUNT_KEY=${{ secrets.FINAM_ACCOUNT_KEY }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'BYBIT_KEY=${{ secrets.BYBIT_KEY }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'BYBIT_SECRET=${{ secrets.BYBIT_SECRET }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'CLOUDRU_API_KEY=${{ secrets.CLOUDRU_API_KEY }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'PROXY_API_KEY=${{ secrets.PROXY_API_KEY }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'DEEPSEEK_KEY=${{ secrets.DEEPSEEK_KEY }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'GIGACHAT_CLIENT_ID=${{ secrets.GIGACHAT_CLIENT_ID }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'GIGACHAT_CLIENT_SECRET=${{ secrets.GIGACHAT_CLIENT_SECRET }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'SPRING_DATASOURCE_USERNAME=postgres' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env && \
             echo 'SPRING_DATASOURCE_PASSWORD=password' >> /home/${{ secrets.SERVER_USER }}/app/infra/.env"
          
          # Connect to server and deploy
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/app/infra
          
            # Stop existing containers
            docker compose down
          
            # Start containers with pre-built JAR
            docker compose up -d
          
            # Show running containers
            docker ps
          EOF