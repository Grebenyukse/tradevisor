plugins {
    id 'org.springframework.boot' version "3.2.4"
    id 'io.spring.dependency-management' version "1.1.4"
    id 'java'
    id 'jacoco'
    id 'com.google.protobuf' version '0.9.4'
    id 'org.liquibase.gradle' version '2.2.0'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // gRPC dependencies
    runtimeOnly 'io.grpc:grpc-netty-shaded:1.58.0'
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    implementation 'io.grpc:grpc-stub:1.58.0'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // YAML processing - обновлена версия до совместимой с Spring Boot 3.2.4
    implementation 'org.yaml:snakeyaml:2.2'

    // Command line parsing
    implementation 'info.picocli:picocli:4.6.1'

    // Liquibase dependencies
    implementation 'org.liquibase:liquibase-core'
    liquibaseRuntime 'org.liquibase:liquibase-core:4.26.0'
    liquibaseRuntime 'org.liquibase:liquibase-groovy-dsl:3.0.2'
    liquibaseRuntime 'ch.qos.logback:logback-core:1.2.9'
    liquibaseRuntime 'ch.qos.logback:logback-classic:1.2.9'
    liquibaseRuntime 'org.postgresql:postgresql:42.7.1'
    liquibaseRuntime 'info.picocli:picocli:4.6.1'
    liquibaseRuntime 'org.yaml:snakeyaml:2.2'

    // External APIs
    implementation 'chat.giga:gigachat-java:0.1.7'
    implementation 'io.github.wuhewuhe:bybit-java-api:1.2.8'

    implementation('io.netty:netty-all') {
        exclude group: 'io.netty', module: 'netty-transport-epoll'
    }

    implementation "com.github.RussianInvestments:invest-api-java-sdk:1.30"

    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    // PostgreSQL driver
    implementation 'org.postgresql:postgresql:42.7.1'

    // Monitoring and tracing
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Telegram bot
    implementation 'org.telegram:telegrambots-meta:6.8.0'

    // JSON processing
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.0.1'

    // Utilities
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'io.github.cdimascio:dotenv-java:2.3.2'
    implementation "org.jfree:jfreechart:1.5.4"

    // Jakarta EE APIs
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'jakarta.annotation:jakarta.annotation-api'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Configuration processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

task integrationTest(type: Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    environment "TESTCONTAINERS_REUSE_ENABLE", "true"
    environment "TESTCONTAINERS_RYUK_DISABLED", "true"
    testLogging {
        events "passed", "skipped", "failed"
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.24.0"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.58.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

bootJar.enabled = true
jar.enabled = false

liquibase {
    activities {
        main {
            arguments = [
                    changeLogFile: 'src/main/resources/changelog/changelog-master.yaml',
                    logLevel: 'debug'
            ]
        }
    }
}

task liquibaseChangelogArchive(type: Zip) {
    from "$buildDir/resources/main/changelog/"
    archiveFileName = "sql.zip"
    destinationDirectory = file("$buildDir/dist")
}

build.finalizedBy liquibaseChangelogArchive
