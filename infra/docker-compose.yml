services:
  postgres:
    image: 'postgres:12.10'
    hostname: postgres
    container_name: postgres
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c pg_stat_statements.max=10000 -c max_connections=200 -c wal_level=logical
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  tradevisor:
    image: eclipse-temurin:17-jre-jammy
    hostname: tradevisor
    container_name: tradevisor
    ports:
      - "8080:8080"
    environment:
      # Telegram Configuration
      CHAT_ID: ${CHAT_ID}
      CHAT_TOKEN: ${CHAT_TOKEN}
      BASE_URL: ${BASE_URL}
      SUPERGROUP_CHAT_ID: ${SUPERGROUP_CHAT_ID}
      POSITIONS_TOPIC_THREAD_ID: ${POSITIONS_TOPIC_THREAD_ID}
      ORDERS_TOPIC_THREAD_ID: ${ORDERS_TOPIC_THREAD_ID}
      RUS_TOPIC_THREAD_ID: ${RUS_TOPIC_THREAD_ID}
      WORLD_TOPIC_THREAD_ID: ${WORLD_TOPIC_THREAD_ID}
      CRYPTO_TOPIC_THREAD_ID: ${CRYPTO_TOPIC_THREAD_ID}
      LOGS_TOPIC_THREAD_ID: ${LOGS_TOPIC_THREAD_ID}
      STATISTICS_TOPIC_THREAD_ID: ${STATISTICS_TOPIC_THREAD_ID}
      ERRORS_TOPIC_THREAD_ID: ${ERRORS_TOPIC_THREAD_ID}
      EVENTS_TOPIC_THREAD_ID: ${EVENTS_TOPIC_THREAD_ID}
      
      # Tinkoff Configuration
      TINKOFF_INVEST_TOKEN: ${TINKOFF_INVEST_TOKEN}
      
      # Finam Configuration
      FINAM_API_KEY: ${FINAM_API_KEY}
      FINAM_ACCOUNT_KEY: ${FINAM_ACCOUNT_KEY}
      
      # Bybit Configuration
      BYBIT_KEY: ${BYBIT_KEY}
      BYBIT_SECRET: ${BYBIT_SECRET}
      
      # AI Services Configuration
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY}
      PROXY_API_KEY: ${PROXY_API_KEY}
      DEEPSEEK_KEY: ${DEEPSEEK_KEY}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID}
      GIGACHAT_CLIENT_SECRET: ${GIGACHAT_CLIENT_SECRET}
      
      # News API Configuration
      NEWS_API_KEY: ${NEWS_API_KEY}
      
      # Database Configuration
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      
    depends_on:
      - postgres
    volumes:
      - ../app.jar:/app/app.jar
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'


  nginx:
    image: nginx:latest
    hostname: nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
      - "6543:5432"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - tradevisor

  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email bugor-p@yandex.ru --agree-tos --no-eff-email -d grebenyukse.ru -d www.grebenyukse.ru --non-interactive

volumes:
  postgres_data:
