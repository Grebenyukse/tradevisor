networks:
  inapp_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1

services:
  postgres:
    image: 'postgres:12.10'
    networks:
      - inapp_network
    hostname: postgres
    container_name: postgres
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c pg_stat_statements.max=10000 -c max_connections=200 -c wal_level=logical
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  tradevisor:
    image: eclipse-temurin:17-jre-jammy
    networks:
      - inapp_network
    hostname: tradevisor
    container_name: tradevisor
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - postgres
    volumes:
      - ../app.jar:/app/app.jar
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  nginx:
    image: nginx:latest
    networks:
      - inapp_network
    hostname: nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - tradevisor
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'