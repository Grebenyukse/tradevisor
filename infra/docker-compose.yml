services:
  postgres:
    image: postgres:16
    hostname: postgres
    container_name: postgres
    command:
      - postgres
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - archive_mode=off
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - max_connections=200
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  tradevisor:
    image: eclipse-temurin:17-jre-jammy
    hostname: tradevisor
    container_name: tradevisor
    user: "65534:65534"  # nobody:nogroup
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs  # если логи пишутся сюда
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ../app.jar:/app/app.jar:ro
    environment:
      CHAT_ID: ${CHAT_ID}
      CHAT_TOKEN: ${CHAT_TOKEN}
      BASE_URL: ${BASE_URL}
      SUPERGROUP_CHAT_ID: ${SUPERGROUP_CHAT_ID}
      POSITIONS_TOPIC_THREAD_ID: ${POSITIONS_TOPIC_THREAD_ID}
      ORDERS_TOPIC_THREAD_ID: ${ORDERS_TOPIC_THREAD_ID}
      RUS_TOPIC_THREAD_ID: ${RUS_TOPIC_THREAD_ID}
      WORLD_TOPIC_THREAD_ID: ${WORLD_TOPIC_THREAD_ID}
      CRYPTO_TOPIC_THREAD_ID: ${CRYPTO_TOPIC_THREAD_ID}
      LOGS_TOPIC_THREAD_ID: ${LOGS_TOPIC_THREAD_ID}
      STATISTICS_TOPIC_THREAD_ID: ${STATISTICS_TOPIC_THREAD_ID}
      ERRORS_TOPIC_THREAD_ID: ${ERRORS_TOPIC_THREAD_ID}
      EVENTS_THREAD_ID: ${EVENTS_THREAD_ID}
      TINKOFF_INVEST_TOKEN: ${TINKOFF_INVEST_TOKEN}
      FINAM_API_KEY: ${FINAM_API_KEY}
      FINAM_ACCOUNT_KEY: ${FINAM_ACCOUNT_KEY}
      BYBIT_KEY: ${BYBIT_KEY}
      BYBIT_SECRET: ${BYBIT_SECRET}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY}
      PROXY_API_KEY: ${PROXY_API_KEY}
      DEEPSEEK_KEY: ${DEEPSEEK_KEY}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID}
      GIGACHAT_CLIENT_SECRET: ${GIGACHAT_CLIENT_SECRET}
      NEWS_API_KEY: ${NEWS_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DB_NAME: postgres
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
  nginx:
    image: nginx:1.25-alpine
    hostname: nginx
    container_name: nginx
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./scripts/init-ssl.sh:/init-ssl.sh:ro
    command: [ "/init-ssl.sh" ]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    ports:
      - "80:80"
      - "443:443"
      - "5432:5432"  # Expose PostgreSQL proxy on port 5432
    depends_on:
      - tradevisor
      - postgres

  certbot:
    image: certbot/certbot
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email bugor-p@yandex.ru --agree-tos --no-eff-email -d grebenyukse.ru -d www.grebenyukse.ru --non-interactive
    depends_on:
      - nginx

volumes:
  postgres_data:
