server:
  port: 8080

logging:
  config: classpath:logback.xml
  level:
    ROOT: info
    org.jooq.Constants.org.jooq.Constants: WARN
    reactor.netty.http.client: INFO

management:
  server:
    port: 8002
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState, ping
        readiness:
          include: readinessState, db
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

spring:
  autoconfigure:
    exclude:
      - ru.ttech.piapi.springboot.configuration.InvestAutoConfiguration
  sleuth:
    enabled: true
  zipkin:
    base-url: http://localhost:9411
    enabled: false #включать при работающем локально jaeger-клиенте
  application:
    name: tradevisor
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: password
  liquibase:
    changeLog: classpath:changelog/changelog-master.yaml
    enabled: true
    url: jdbc:postgresql://localhost:5432/postgres    # Add explicit URL
    user: postgres                                    # Add credentials
    password: password
    default-schema: tradevisor

app:
  collect:                    # сбор информации для анализа
    events:                   # события, влияющие на ценную бумагу
      dividends: false        # выплата дивидендов
      economic: false         # макроэкономика и прочие
      expiration: false       # экспирация
      reports: false
      news: false
    prices:
      delay: PT10M
      finam: true
      tinkoff: true
      bybit: true
      yahoofinance: true
  calculate:
    delay: PT10M
    fibo: true
    bars_required_to_calculate_fibo: 150
    gap: false
    min_touches_count: 2
    batch-size: 1000
  trade:
    delay: PT15M
    limits: 1
    enabled: false
  notification:
    enabled: true
    delay: PT1M
  cleanup:
    cron: 0 0 0 1 * ?
    retention_days: 30
    enabled: true
  integration:
    cloudru:
      enabled: true
      key: ${CLOUDRU_API_KEY}
    proxyapi:
      enabled: false
      key: ${PROXY_API_KEY}
      url: https://api.proxyapi.ru/deepseek/chat/completions
    deepseek:
      enabled: false
      url: https://api.deepseek.com/v1/chat/completions
      key: ${DEEPSEEK_KEY}
    gigachat:
      enabled: false
      client-id: ${GIGACHAT_CLIENT_ID}
      client-secret: ${GIGACHAT_CLIENT_SECRET}
    telegram:
      enabled: true
      chat-id: ${CHAT_ID}
      chat-token: ${CHAT_TOKEN}
      base-url: ${BASE_URL}
      webhook-path: "/"
      re-register: false
      supergroup:
        chat-id: ${SUPERGROUP_CHAT_ID}
        positions-thread-id: ${POSITIONS_TOPIC_THREAD_ID}
        orders-thread-id: ${ORDERS_TOPIC_THREAD_ID}
        rus-thread-id: ${RUS_TOPIC_THREAD_ID}
        world-thread-id: ${WORLD_TOPIC_THREAD_ID}
        crypto-thread-id: ${CRYPTO_TOPIC_THREAD_ID}
        logs-thread-id: ${LOGS_TOPIC_THREAD_ID}
        statistics-thread-id: ${STATISTICS_TOPIC_THREAD_ID}
        errors-thread-id: ${ERRORS_TOPIC_THREAD_ID}
        events-thread-id: ${EVENTS_THREAD_ID}
    newsapi:
      enabled: false
      api-key: ${NEWS_API_KEY}
      url: "https://newsapi.org/v2/top-headlines?category=business"
      page-size: 50
    tinkoff:
      enabled: true
      token: ${TINKOFF_INVEST_TOKEN}
      host: "invest-public-api.tinkoff.ru:443"
      history-max-depth-days: 30
    finam:
      enabled: true
      secret: ${FINAM_API_KEY}
      url: https://api.finam.ru/v1
      host: api.finam.ru
      port: 443
      account-id: ${FINAM_ACCOUNT_KEY}
      history-max-depth-days: 30
    bybit:
      enabled: true
      key: ${BYBIT_KEY}
      secret: ${BYBIT_SECRET}
      url: https://api.bybit.com
      history-max-depth-days: 30
    yahoofinance:
      enabled: true
      url: https://query1.finance.yahoo.com
      history-max-depth-days: 30
